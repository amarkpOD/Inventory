services:
  - type: web
    name: inventory-system-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: MONGO_DB_NAME
        value: Inventory
      - key: ITEMS_COLLECTION
        value: Inventory
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
